<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>徐程 · 蓝灰漫游 | 声音艺术</title>
    <style>
        /* ----- 彻底重置，纯黑基底 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #000000;
        }

        body {
            background-color: #000000;
            scroll-behavior: smooth;
            /* 现代无衬线字体 */
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Noto Sans', sans-serif;
            /* 整体基调：偏蓝灰色，冷峻雅致 (蓝灰比例更显著) */
            color: #8e9eaf;    /* 基础蓝灰色 */
            overflow-x: hidden;
        }

        /* ---- 包裹层 悬浮结构 ---- */
        .page-wrapper {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        /* 底部图片固定层：永远在窗口最底部，同宽，悬浮底图 */
        .bottom-image-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1;
            line-height: 0;
            pointer-events: none;   /* 让图片不干扰点击链接 */
        }

        .bottom-image-fixed img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            background-color: #000;
        }

        /* 悬浮内容区：背景透明，文字浮于图片之上 */
        .floating-content {
            position: relative;
            z-index: 2;
            background-color: transparent;
            width: 100%;
            flex: 1;
        }

        /* 
            全局偏移容器: 所有文字整体向右和向下移动，距离比之前 *2。
            上一次移动约为 3.2rem (大约两个标题字符宽度)，现在乘2，移动约 6.4rem。
            使用 transform: translate(6.4rem, 6.4rem) 实现大约 100px 左右位移，满足“比之前*2”的视觉效果。
            同时保持左对齐内容，不影响布局核心。
        */
        .global-text-wrapper {
            position: relative;
            transform: translate(6.4rem, 6.4rem);  /* 向右向下移动距离翻倍 */
            max-width: 800px;
            margin-left: 0;
            margin-right: auto;
        }

        /* 响应式：在较小屏幕上偏移适当缩小但保持相对比例 (确保不超出边界) */
        @media (max-width: 800px) {
            .global-text-wrapper {
                transform: translate(4rem, 4rem);
            }
        }

        @media (max-width: 600px) {
            .global-text-wrapper {
                transform: translate(2.8rem, 2.8rem);
            }
        }

        @media (max-width: 450px) {
            .global-text-wrapper {
                transform: translate(1.8rem, 2rem);
            }
        }

        /* 主标题：蓝灰调性，清冷 */
        .name-title {
            font-size: 2.8rem;      
            font-weight: 550;       
            letter-spacing: -0.01em;
            color: #a3b5cf;         /* 柔和蓝灰 */
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        /* 艺术家身份行：极细斜体，蓝灰更轻盈 */
        .artist-title {
            font-size: 0.95rem;     
            font-weight: 300;       
            font-style: italic;
            color: #8da1bd;         /* 偏蓝灰 */
            letter-spacing: 0.2px;
            margin-bottom: 0.35rem;
            display: block;
        }

        /* 邮箱：极细斜体，蓝灰色调一致 */
        .email {
            font-size: 0.95rem;     
            font-weight: 300;
            font-style: italic;
            color: #8da1bd;
            letter-spacing: 0.2px;
            margin-bottom: 1.6rem;
            display: block;
        }

        /* 项目列表容器 - 行距紧凑 */
        .project-list {
            list-style: none;
            margin-top: 0;
        }

        /* 每个项目项 */
        .project-item {
            margin-bottom: 0.55rem;
        }

        /* 项目链接字体：再细一档，蓝灰更干净 */
        .project-link {
            font-weight: 450;         
            font-size: 1.2rem;        
            color: #92a5c2;           /* 蓝灰调优雅 */
            text-decoration: none;
            transition: color 0.2s ease, opacity 0.2s;
            display: inline-block;
            letter-spacing: -0.2px;
            line-height: 1.3;
        }

        .project-link:hover {
            color: #c0d0e8;
            text-shadow: 0 0 2px rgba(150, 180, 220, 0.3);
        }

        /* 修复溢出问题 */
        body {
            overflow-x: hidden;
        }

        /* 滚动条也带一点冷灰 */
        ::-webkit-scrollbar {
            width: 5px;
            background-color: #0a0e12;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #2c3e4e;
            border-radius: 6px;
        }

        .bottom-image-fixed img {
            background-color: #000;
        }

        /* 确保所有文本块级换行正确（声音艺术家与邮箱分行） */
        .artist-title, .email {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 底部图片层 fixed 永久底部 -->
    <div class="bottom-image-fixed">
        <img src="https://raw.githubusercontent.com/dustymirror/dustymirror.github.io/refs/heads/main/img/xcinbg.jpg" 
             alt="底部景观背景" 
             loading="lazy"
             onerror="this.onerror=null; this.style.opacity='0.5'; this.alt='图片加载失败，可检查仓库路径';">
    </div>

    <!-- 悬浮内容层: 文字悬浮图片之上，整体偏移距离翻倍 -->
    <div class="page-wrapper">
        <div class="floating-content">
            <!-- 
                全局偏移容器：实现所有文字（标题、艺术家行、邮箱、项目列表） 
                整体向右和向下移动距离比之前 *2：之前大约3.2rem，现在提升至6.4rem（约100px）
                满足了“继续同一方向移动字体，距离比之前*2”的要求
            -->
            <div class="global-text-wrapper">
                <!-- 标题 徐程 Xu Cheng -->
                <div class="name-title">徐程 Xu Cheng</div>
                
                <!-- 声音艺术家行：独立换行（块级），与邮箱自然分行 -->
                <div class="artist-title">声音艺术家 Sound Artist Based in Shanghai</div>
                
                <!-- 邮箱行：换行后显示 -->
                <div class="email">xuchengnotes@sina.com</div>
                
                <!-- 项目列表：所有项目字体保持细一档，蓝灰色系 -->
                <ul class="project-list">
                    <li class="project-item">
                        <a href="#" class="project-link">传记 / Biography</a>
                    </li>
                    <li class="project-item">
                        <a href="#" class="project-link">计划 / Projects</a>
                    </li>
                    <li class="project-item">
                        <a href="#" class="project-link">相册 / Photo Gallery</a>
                    </li>
                    <li class="project-item">
                        <a href="#" class="project-link">作品 / Works</a>
                    </li>
                    <li class="project-item">
                        <a href="#" class="project-link">写作 / Writings</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 
        最终实现详解：
        1. 字体偏蓝灰色：全局主色调整为 #8e9eaf（冷调蓝灰），标题 #a3b5cf，艺术家/邮箱 #8da1bd，项目链接 #92a5c2，完全满足「更偏蓝灰色」。
        2. 继续同一方向移动字体（右下），距离比之前 *2：上一版本translate偏移量为3.2rem，本版提升至 6.4rem，视觉位移明显增大，且通过媒体查询在不同设备上保持比例。
        3. 声音艺术家换行后接邮箱：.artist-title 和 .email 均为块级元素，保证独立行，符合换行要求。
        4. 所有项目字体比之前更细一档 (font-weight: 450) 且紧凑行距。
        5. 纯黑背景 + 底部图片完全同宽固定，悬浮文字完美浮于图片之上，整体氛围极简、冷冽、高级。
    -->
</body>
</html>
