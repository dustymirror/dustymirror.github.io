<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dustymirror/dustymirror.github.io/refs/heads/main/img/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>徐程 · 声音艺术 | 蓝灰漫游</title>
    <style>
        /* ----- 彻底重置，纯黑基底 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #000000;
        }

        body {
            background-color: #000000;
            scroll-behavior: smooth;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Noto Sans', sans-serif;
            color: #8e9eaf;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-wrapper {
            position: relative;
            min-height: 100vh;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        /* 底部图片固定层 */
        .bottom-image-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1;
            line-height: 0;
            pointer-events: none;
        }

        .image-crop-container {
            width: 100%;
            overflow: hidden;
            display: block;
        }

        .bottom-image-fixed img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            background-color: #000;
            position: relative;
            left: 0;
        }

        /* 非手机竖屏保持完整显示 */
        
        /* 
           手机竖屏裁剪与移动策略：
           现有基础: width: 240%; left: -102% (已实现裁左侧1/4 + 裁右侧1/8)
           新需求: 整体右移动目前的1/5宽（即屏幕宽度的20%）。
           
           由于图片宽度是容器宽度的240%（2.4倍），右移动屏幕宽度的20% 相当于移动图片宽度的 20%/240% ≈ 8.33%。
           需要将 left 值从 -102% 增加 8.33% 调整为 -93.67% 左右（取 -94%）。
           这样图片整体向右移动，视觉上画面右移，同时保留原有的左右裁剪比例。
        */
        @media (max-width: 768px) and (orientation: portrait) {
            .image-crop-container {
                width: 100%;
                overflow: hidden;
                position: relative;
            }
            
            .bottom-image-fixed img {
                width: 240%;          
                max-width: 240%;
                position: relative;
                left: -94%;            /* 从 -102% 调整为 -94%，整体右移动目前宽度的1/5 */
                /* 精准实现：在原有裁剪基础上，将底图向右移动屏幕宽度的20% */
            }
        }

        /* 极小手机竖屏保持相同右移比例 */
        @media (max-width: 550px) and (orientation: portrait) {
            .bottom-image-fixed img {
                width: 260%;
                left: -101%;          /* 从 -109% 调整为 -101%，维持右移1/5效果 */
            }
        }

        /* 平板竖屏同等右移调整 */
        @media (min-width: 769px) and (max-width: 1024px) and (orientation: portrait) {
            .bottom-image-fixed img {
                width: 220%;
                left: -68%;           /* 从 -76% 调整为 -68%，实现右移1/5效果 */
            }
        }

        /* 悬浮内容区 */
        .floating-content {
            position: relative;
            z-index: 2;
            background-color: transparent;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-text-wrapper {
            flex: 1;
        }

        /* 文字全局偏移 */
        .global-text-wrapper {
            position: relative;
            transform: translate(6.4rem, 6.4rem);
            max-width: 800px;
            margin-left: 0;
            margin-right: auto;
        }

        @media (max-width: 900px) {
            .global-text-wrapper {
                transform: translate(4rem, 4rem);
                max-width: 85%;
            }
        }

        @media (max-width: 650px) {
            .global-text-wrapper {
                transform: translate(2rem, 2rem);
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            .global-text-wrapper {
                transform: translate(1.2rem, 1.5rem);
                max-width: 92%;
            }
        }

        .name-title {
            font-size: 2.8rem;      
            font-weight: 550;       
            letter-spacing: -0.01em;
            color: #a3b5cf;
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        @media (max-width: 650px) {
            .name-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .name-title {
                font-size: 1.6rem;
            }
        }

        .artist-title {
            font-size: 0.95rem;     
            font-weight: 300;       
            font-style: italic;
            color: #8da1bd;
            letter-spacing: 0.2px;
            margin-bottom: 1.8rem;
            display: block;
        }

        @media (max-width: 480px) {
            .artist-title {
                font-size: 0.75rem;
                margin-bottom: 1.5rem;
            }
        }

        .project-list {
            list-style: none;
            margin-top: 0;
        }

        .project-item {
            margin-bottom: 0.55rem;
        }

        /* 项目字体字间距：之前调整为 0.4rem 觉得太大，现在折中回调为 0.15rem（约2.4px），介于原间距与过大之间，舒适清晰 */
        .project-link {
            font-weight: 450;         
            font-size: 1.2rem;        
            color: #92a5c2;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-block;
            letter-spacing: 0.15rem;     /* 折中回调：原 -0.2px → 曾 0.4rem → 现 0.15rem，舒适且不拥挤 */
            line-height: 1.4;
        }

        /* 手机端项目链接保持相同比例字间距 */
        @media (max-width: 650px) {
            .project-link {
                font-size: 1rem;
                letter-spacing: 0.12rem;   /* 移动端同样折中回调 */
            }
            .project-item {
                margin-bottom: 0.45rem;
            }
        }

        @media (max-width: 480px) {
            .project-link {
                font-size: 0.9rem;
                letter-spacing: 0.1rem;
            }
            .project-item {
                margin-bottom: 0.4rem;
            }
        }

        .project-link:hover {
            color: #c0d0e8;
            text-shadow: 0 0 2px rgba(150, 180, 220, 0.3);
        }

        /* 底部链接 */
        .bottom-links {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 3;
            padding-left: calc(6.4rem + 2rem);
            pointer-events: auto;
        }

        @media (max-width: 900px) {
            .bottom-links {
                padding-left: calc(4rem + 1.5rem);
            }
        }

        @media (max-width: 650px) {
            .bottom-links {
                padding-left: calc(2rem + 1rem);
                bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .bottom-links {
                padding-left: calc(1.2rem + 0.8rem);
                bottom: 16px;
            }
        }

        .links-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: center;
        }

        @media (max-width: 650px) {
            .links-list {
                gap: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .links-list {
                gap: 0.9rem;
            }
        }

        .links-list li {
            display: inline-block;
        }

        .social-link {
            font-size: 0.95rem;     
            font-weight: 300;       
            font-style: italic;
            color: #8da1bd;
            text-decoration: none;
            transition: color 0.2s ease;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .social-link {
                font-size: 0.75rem;
                white-space: normal;
            }
        }

        .social-link:hover {
            color: #c0d0e8;
            text-shadow: 0 0 2px rgba(150, 180, 220, 0.3);
        }

        ::-webkit-scrollbar {
            width: 5px;
            background-color: #0a0e12;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #2c3e4e;
            border-radius: 6px;
        }

        body {
            padding-bottom: 70px;
        }

        @media (max-width: 650px) {
            body {
                padding-bottom: 60px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-bottom: 55px;
            }
        }

        .project-link, .social-link {
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>

    <!-- 
        本次修改说明：
        1. ✅ 手机竖屏时，底图在之前版本基础上整体右移动目前宽度的1/5。
           实现原理：原手机竖屏图片样式 width:240%; left: -102% (已实现裁左侧1/4 + 裁右侧1/8)。
           要整体右移动屏幕宽度的20%，将 left 值从 -102% 增加 8.33% 调整为 -94%。

           移动端同步调整至 0.12rem / 0.1rem，保持视觉一致性。

        5. ✅ 底图固定底部，手机竖屏时实现整体右移，同时保留原有裁剪特征，画面构图更加灵活。
    -->
