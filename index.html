<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>徐程 · 声音艺术 | 蓝灰漫游</title>
    <style>
        /* ----- 彻底重置，纯黑基底 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #000000;
        }

        body {
            background-color: #000000;
            scroll-behavior: smooth;
            /* 现代无衬线字体 */
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Noto Sans', sans-serif;
            /* 整体基调：偏蓝灰色 */
            color: #8e9eaf;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- 包裹层 悬浮结构 ---- */
        .page-wrapper {
            position: relative;
            min-height: 100vh;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        /* 底部图片固定层：永远在窗口最底部，同宽，悬浮底图 */
        .bottom-image-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1;
            line-height: 0;
            pointer-events: none;
        }

        .bottom-image-fixed img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            background-color: #000;
        }

        /* 悬浮内容区：背景透明，文字浮于图片之上，使用flex列布局让底部链接自动贴底 */
        .floating-content {
            position: relative;
            z-index: 2;
            background-color: transparent;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 主要内容容器（标题+项目列表） */
        .main-text-wrapper {
            flex: 1;
        }

        /* 
            全局偏移容器: 所有主要文字（标题、艺术家、项目列表）整体向右和向下移动。
            移动距离使用视口单位 vw 和相对单位，使得手机端也完美适配。
            桌面端保持 6.4rem，手机端动态缩小，确保不超出屏幕。
        */
        .global-text-wrapper {
            position: relative;
            transform: translate(6.4rem, 6.4rem);
            max-width: 800px;
            margin-left: 0;
            margin-right: auto;
        }

        /* 平板及手机适配：偏移量和最大宽度动态调整 */
        @media (max-width: 900px) {
            .global-text-wrapper {
                transform: translate(4rem, 4rem);
                max-width: 85%;
            }
        }

        @media (max-width: 650px) {
            .global-text-wrapper {
                transform: translate(2rem, 2rem);
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            .global-text-wrapper {
                transform: translate(1.2rem, 1.5rem);
                max-width: 92%;
            }
        }

        /* 主标题：蓝灰调性，手机端字体适当缩小 */
        .name-title {
            font-size: 2.8rem;      
            font-weight: 550;       
            letter-spacing: -0.01em;
            color: #a3b5cf;
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        @media (max-width: 650px) {
            .name-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .name-title {
                font-size: 1.6rem;
            }
        }

        /* 艺术家身份行：极细斜体 */
        .artist-title {
            font-size: 0.95rem;     
            font-weight: 300;       
            font-style: italic;
            color: #8da1bd;
            letter-spacing: 0.2px;
            margin-bottom: 0.35rem;
            display: block;
        }

        @media (max-width: 480px) {
            .artist-title {
                font-size: 0.75rem;
            }
        }

        /* 项目列表容器 */
        .project-list {
            list-style: none;
            margin-top: 0;
        }

        .project-item {
            margin-bottom: 0.55rem;
        }

        .project-link {
            font-weight: 450;         
            font-size: 1.2rem;        
            color: #92a5c2;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-block;
            letter-spacing: -0.2px;
            line-height: 1.3;
        }

        /* 手机端项目链接字体缩小 */
        @media (max-width: 650px) {
            .project-link {
                font-size: 1rem;
            }
            .project-item {
                margin-bottom: 0.45rem;
            }
        }

        @media (max-width: 480px) {
            .project-link {
                font-size: 0.9rem;
            }
            .project-item {
                margin-bottom: 0.4rem;
            }
        }

        .project-link:hover {
            color: #c0d0e8;
            text-shadow: 0 0 2px rgba(150, 180, 220, 0.3);
        }

        /* ---------- 底部链接容器：屏幕最下边向上30像素，左对齐 ---------- */
        .bottom-links {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            z-index: 3;
            /* 根据屏幕宽度动态调整左间距，确保和主文字对齐 */
            padding-left: calc(6.4rem + 2rem);
            pointer-events: auto;
        }

        @media (max-width: 900px) {
            .bottom-links {
                padding-left: calc(4rem + 1.5rem);
            }
        }

        @media (max-width: 650px) {
            .bottom-links {
                padding-left: calc(2rem + 1rem);
                bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .bottom-links {
                padding-left: calc(1.2rem + 0.8rem);
                bottom: 16px;
            }
        }

        /* 链接列表样式：与原邮箱字体完全一致，手机端弹性换行 */
        .links-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: center;
        }

        @media (max-width: 650px) {
            .links-list {
                gap: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .links-list {
                gap: 0.9rem;
            }
        }

        .links-list li {
            display: inline-block;
        }

        .social-link {
            font-size: 0.95rem;     
            font-weight: 300;       
            font-style: italic;
            color: #8da1bd;
            text-decoration: none;
            transition: color 0.2s ease;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        /* 手机端如果文字太多允许换行，但这里每个词较短，保持一行 */
        @media (max-width: 480px) {
            .social-link {
                font-size: 0.75rem;
                white-space: normal;
            }
        }

        .social-link:hover {
            color: #c0d0e8;
            text-shadow: 0 0 2px rgba(150, 180, 220, 0.3);
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
            background-color: #0a0e12;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #2c3e4e;
            border-radius: 6px;
        }

        .bottom-image-fixed img {
            background-color: #000;
        }

        /* 确保点击区域在手机上足够友好 */
        .project-link, .social-link {
            cursor: pointer;
            touch-action: manipulation;
        }

        /* 防止内容被底部链接遮挡，给 body 底部留出足够空间 */
        body {
            padding-bottom: 70px;
        }

        @media (max-width: 650px) {
            body {
                padding-bottom: 60px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-bottom: 55px;
            }
        }
    </style>
</head>
